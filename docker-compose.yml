#    networks:
#      - com-roconmachine-io

  kafka:
    image: 'bitnami/kafka:3.3.1'
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://192.168.0.138:9092
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_KRAFT_CLUSTER_ID=r4zt_wrqTRuT7W2NJsB_GA
    volumes:
      - kafka-data-email:/bitnami/kafka
    networks:
      - com-roconmachine-io

  kafka-ui:
    container_name: kafka-ui
    image: 'provectuslabs/kafka-ui:latest'
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_NAME=r4zt_wrqTRuT7W2NJsB_GA
    networks:
      - com-roconmachine-io



  notification-processor:
    container_name: notification-processor
    build:
      context: ./io.notification.processor
      dockerfile: Dockerfile
    environment:
      - CONFIG_SERVER_URL=http://192.168.0.138:8888
      - EUREKA_URI=http://192.168.0.138:8761/eureka
    ports:
      - 8089:8089
    depends_on:
      - kafka
    networks:
      - com-roconmachine-io
  notification:
    container_name: notification
    build:
      context: ./io.notification
      dockerfile: Dockerfile
    environment:
      - CONFIG_SERVER_URL=http://192.168.0.138:8888
      - EUREKA_URI=http://192.168.0.138:8761/eureka
    ports:
      - 8088:8088
    depends_on:
      - kafka
    networks:
      - com-roconmachine-io
  mail-dev:
    container_name: ms-mail-dev
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025




networks:
  com-roconmachine-io:
    driver: bridge